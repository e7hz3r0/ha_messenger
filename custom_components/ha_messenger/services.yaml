send_message:
  name: Send message
  description: Render a message to the virtual camera and trigger motion.
  target:
    entity:
      domain: camera
      integration: ha_messenger
  fields:
    message:
      name: Message
      description: Text to render on the camera frame.
      required: true
      example: "Dinner is ready"
      selector:
        text:
          multiline: true
    duration:
      name: Duration
      description: Seconds the motion sensor stays on.
      example: 10
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds
          mode: box
    notify_targets:
      name: Notify targets
      description: "List of notify targets to push the message to. On modern HA these
        target the notify entities registered by mobile_app (e.g. `notify.mobile_app_ethan_iphone`);
        the bare slug (`mobile_app_ethan_iphone`) is also accepted. Falls back to the
        legacy `notify.<name>` services on older cores."
      example: ["mobile_app_ethan_iphone"]
      selector:
        object: {}
    preview_only:
      name: Preview only
      description: Update the camera image without triggering motion detection or push notifications.
      selector:
        boolean:
